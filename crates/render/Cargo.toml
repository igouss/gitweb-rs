[package]
name = "gitweb-render"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Framework-free, modernized HTML rendering of gitweb-rs domain view-models."

[lints.rust]
unsafe_code = "forbid"

[dependencies]
# The inward dependency: render turns domain view-models into HTML. Nothing
# else — no git library, no web framework.
gitweb-domain = { path = "../domain" }
# Compile-time HTML templating; auto-escapes by default, PreEscaped is the
# raw-HTML safe-sink.
maud = { workspace = true }

[dev-dependencies]
cucumber = { workspace = true }
tokio = { workspace = true }

# Gherkin-driven BDD for render behaviours (escaping, styling, chrome).
# cucumber supplies its own main(), so the default libtest harness is disabled.
[[test]]
name = "render"
harness = false

[package.metadata.hex-arch]
role = "port-and-adapter"
