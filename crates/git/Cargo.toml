[package]
name = "gitweb-git"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The gix-backed adapter implementing gitweb-rs's Repository and ProjectStore ports."

[lints.rust]
unsafe_code = "forbid"

[dependencies]
gitweb-domain = { path = "../domain" }
gix = { workspace = true }

[dev-dependencies]
gitweb-fixtures = { path = "../fixtures" }
cucumber = { workspace = true }
tokio = { workspace = true }

# Gherkin conformance for the gix adapter: real reads over gix-built fixtures.
# cucumber supplies its own main(), so the default libtest harness is disabled.
[[test]]
name = "conformance"
harness = false

# Conformance for the `history` operation (rev-list: order, pagination, path).
[[test]]
name = "history"
harness = false

# Conformance for ProjectStore discovery: list + open over a fixture root.
[[test]]
name = "discovery"
harness = false

# Conformance for the `diff` operation: two-tree diff + rename detection.
[[test]]
name = "diff"
harness = false
