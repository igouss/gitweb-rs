[package]
name = "gitweb-domain"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Framework-free git-domain entities, ports, and use cases for gitweb-rs."

[lints.rust]
unsafe_code = "forbid"

[dependencies]
# gitweb's `search_use_regexp` toggle: the search pattern matcher is a pure rule
# (fixed-string or case-insensitive regular expression), so it lives here. A regex
# engine is a library, not a framework, and crosses no port — see the workspace
# manifest for the rationale.
regex = { workspace = true }

[dev-dependencies]
cucumber = { workspace = true }
tokio = { workspace = true }

# Gherkin-driven BDD runner for domain rules. cucumber supplies its own main(),
# so the default libtest harness is disabled.
[[test]]
name = "domain"
harness = false

# Gherkin-driven BDD runner for use cases: the orchestration over the ports,
# driven through an in-memory fake store (no adapter dependency). cucumber
# supplies its own main(), so the default libtest harness is disabled.
[[test]]
name = "usecase"
harness = false
