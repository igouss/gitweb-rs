[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/fixtures",
    "crates/git",
]

[workspace.package]
edition = "2024"
rust-version = "1.93"
license = "GPL-2.0-only"
repository = "https://github.com/elendal/gitweb_in_rust"

[workspace.dependencies]
# Async BDD test harness (Gherkin .feature files).
cucumber = "0.23"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Pure-Rust git backend. The fixture builder writes objects/refs with it; the
# git adapter will read with it. No git binary at test time.
gix = "0.84"
# Throwaway repos for deterministic fixtures.
tempfile = "3"
