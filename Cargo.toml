[workspace]
resolver = "3"
members = [
    "crates/app",
    "crates/config",
    "crates/domain",
    "crates/fixtures",
    "crates/git",
    "crates/parity",
    "crates/render",
    "crates/web",
]

[workspace.package]
edition = "2024"
rust-version = "1.93"
license = "GPL-2.0-only"
repository = "https://github.com/elendal/gitweb_in_rust"

[workspace.dependencies]
# Async BDD test harness (Gherkin .feature files).
cucumber = "0.23"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Pure-Rust git backend. The fixture builder writes objects/refs with it; the
# git adapter will read with it. No git binary at test time.
gix = "0.84"
# Throwaway repos for deterministic fixtures.
tempfile = "3"
# Compile-time, auto-escaping HTML templating for the render adapter. PreEscaped
# is the raw-HTML safe-sink by construction; the generated code contains no
# unsafe, so it satisfies the workspace's unsafe_code = forbid rule.
maud = "0.27"
# The HTTP server framework for the web boundary: routing, extractors, and the
# Response type the outbound adapter builds. Standalone, replacing gitweb's CGI.
axum = "0.8"
# Correct decoders for the inbound boundary: form_urlencoded splits and decodes
# the query string (application/x-www-form-urlencoded), percent-encoding decodes
# the request path (PATH_INFO). Both from the rust-url team; tiny, dependency-light.
form_urlencoded = "1"
percent-encoding = "2"
# Test-only: drives the assembled axum Router with a single in-process request
# (ServiceExt::oneshot), so the web boundary's end-to-end behaviour is specced
# without binding a socket.
tower = { version = "0.5", features = ["util"] }
# Static-file serving for the composition root: ServeDir mounts the git-ignored,
# built-on-demand @pierre/diffs viewer bundle. A missing bundle 404s rather than
# crashing, so the binary stays inspectable without it. Only the app crate (the
# adapter-aware composition root) depends on this.
tower-http = { version = "0.6", features = ["fs"] }
# The declarative on-disk format for gitweb-rs global config (replacing gitweb's
# executable Perl) and the derive that maps it onto the domain's config layers.
# serde stays a pure data dependency; only the config adapter knows the format.
serde = { version = "1", features = ["derive"] }
toml = "0.9"
# Pure-computation regex engine for gitweb's `search_use_regexp` toggle: a search
# pattern is either a fixed string or a (case-insensitive) regular expression, and
# emulating `git log --extended-regexp` / the highlight split needs a real matcher.
# It is a library, not a framework, and depends on nothing of ours, so it lives in
# the domain alongside the other pure primitives (it never crosses a port).
regex = "1"
